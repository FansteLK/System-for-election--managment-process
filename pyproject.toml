[project]
name = "election-system"
version = "2.0.0"
description = "Microservice election management system: Flask, SQLAlchemy, Redis, Docker Swarm"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The demo script runs with any system Python 3.8+.
"scripts/*" = ["B905", "UP017"]
